name: Midnight Project CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verification:
    name: CI Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install Compact CLI
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/download/compact-v0.5.1/compact-installer.sh | sh
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: compact update 0.30 || true
      - run: npm ci || npm install
      - run: npm run compile:contract
      - run: npm test
      - run: npm run typecheck || true
      - run: |
          if [ -d "ui" ]; then
            npm --prefix ui ci || npm --prefix ui install
            npm --prefix ui run build
          fi

